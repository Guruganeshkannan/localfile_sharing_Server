<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>📂 FileShare - Drag & Drop Uploads</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            background: linear-gradient(135deg, #f5f7fa, #c3cfe2);
            padding: 20px;
        }
        
        h1 {
            font-size: 2.5em;
        }
        
        .container {
            max-width: 500px;
            margin: auto;
            padding: 20px;
            background: white;
            border-radius: 10px;
            box-shadow: 0px 0px 10px rgba(0, 0, 0, 0.1);
        }
        
        .drag-area {
            border: 2px dashed #007bff;
            padding: 20px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 10px;
            background: #eaf2ff;
        }
        
        .drag-area:hover {
            background: #d0e0ff;
        }
        
        input[type="file"] {
            display: none;
        }
        
        button {
            padding: 10px 15px;
            font-size: 16px;
            background: #007bff;
            color: white;
            border: none;
            cursor: pointer;
            border-radius: 5px;
            transition: 0.3s;
            margin-top: 10px;
        }
        
        button:hover {
            background: #0056b3;
        }
        
        #progressContainer {
            width: 100%;
            background-color: #ddd;
            border-radius: 5px;
            margin-top: 10px;
            display: none;
        }
        
        #progressBar {
            width: 0%;
            height: 10px;
            background-color: #28a745;
            border-radius: 5px;
        }
        
        ul {
            list-style-type: none;
            padding: 0;
        }
        
        li {
            padding: 8px;
            background: #fff;
            margin: 5px 0;
            border-radius: 5px;
            box-shadow: 1px 1px 5px rgba(0, 0, 0, 0.1);
        }
        
        a {
            text-decoration: none;
            color: #007bff;
            font-weight: bold;
        }
        
        a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>
    <h1>📂 FileShare - Drag & Drop 🚀</h1>

    <div class="container">
        <h2>⬆️ Upload File</h2>

        <!-- Drag and Drop Area -->
        <div class="drag-area" id="dragArea">
            <p>Drag & Drop files here 📂 or <strong>Click</strong> to select</p>
            <input type="file" id="fileInput">
        </div>

        <button onclick="uploadFile()">Upload 📤</button>

        <div id="progressContainer">
            <div id="progressBar"></div>
        </div>
        <p id="uploadStatus"></p>
    </div>

    <div class="container">
        <h2>📥 Download Files</h2>
        <ul>
            {% for file in files %}
            <li>📄 <a href="{{ url_for('download_file', filename=file) }}">{{ file }}</a></li>
            {% endfor %}
        </ul>
    </div>

    <script>
        const dragArea = document.getElementById("dragArea");
        const fileInput = document.getElementById("fileInput");

        dragArea.addEventListener("dragover", (e) => {
            e.preventDefault();
            dragArea.style.background = "#d0e0ff";
        });

        dragArea.addEventListener("dragleave", () => {
            dragArea.style.background = "#eaf2ff";
        });

        dragArea.addEventListener("drop", (e) => {
            e.preventDefault();
            dragArea.style.background = "#eaf2ff";
            fileInput.files = e.dataTransfer.files;
        });

        dragArea.addEventListener("click", () => {
            fileInput.click();
        });

        function uploadFile() {
            const file = fileInput.files[0];

            if (!file) {
                alert("Please select a file to upload! ❌");
                return;
            }

            const formData = new FormData();
            formData.append("file", file);

            const xhr = new XMLHttpRequest();
            xhr.open("POST", "/upload", true);

            // Show Progress Bar
            document.getElementById("progressContainer").style.display = "block";

            xhr.upload.onprogress = function(event) {
                if (event.lengthComputable) {
                    let percentComplete = (event.loaded / event.total) * 100;
                    document.getElementById("progressBar").style.width = percentComplete + "%";
                    document.getElementById("uploadStatus").textContent = `Uploading... ${Math.round(percentComplete)}%`;
                }
            };

            xhr.onload = function() {
                if (xhr.status === 200) {
                    document.getElementById("uploadStatus").textContent = "✅ Upload Complete!";
                    setTimeout(() => {
                        location.reload();
                    }, 1000);
                } else {
                    document.getElementById("uploadStatus").textContent = "❌ Upload Failed!";
                }
            };

            xhr.onerror = function() {
                document.getElementById("uploadStatus").textContent = "❌ Error uploading file!";
            };

            xhr.send(formData);
        }
    </script>
</body>

</html>
